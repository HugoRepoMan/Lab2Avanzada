spring.application.name=auditoria-api
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pa_lab2}
spring.datasource.username=${DB_USER:pa_user}
spring.datasource.password=${DB_PASSWORD:pa_secret}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
server.error.include-stacktrace=never
spring.devtools.restart.enabled=false
